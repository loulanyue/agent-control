version: '3.8'

services:
  agent-control:
    build: .
    container_name: agent-control
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Agent Control Plane
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=agent_secret
      - DB_NAME=agent_control
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  mysql:
    image: mysql:8.0
    container_name: agent-control-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=agent_secret
      - MYSQL_DATABASE=agent_control
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pagent_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
